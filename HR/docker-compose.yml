services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hr
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hr}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U hr
      interval: 5s
      timeout: 3s
      retries: 5
    # ports: [5432:5432]  # disabled — DB доступна только внутри сети Docker

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgresql://hr:${DB_PASSWORD:-hr}@db/hr
      PUBLIC_URL: http://192.168.1.92:8000
      LOG_LEVEL: INFO
      SMTP_HOST: smtp.yandex.ru
      SMTP_PORT: "587"
      SMTP_USER: maximumkh@yandex.ru
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: maximumkh@yandex.ru
      EMAIL_TO: homutov.m@gmail.com
    ports: [8000:8000]
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "alembic upgrade head &&
             uvicorn web.app:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    volumes:
      - /opt/hr:/app

volumes:
  pgdata:
