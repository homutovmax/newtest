---
- name: Deploy HR 2.0
  hosts: hr
  vars:
    project_dir: /opt/hr
    db_password: "{{ vault_db_password | default('hr') }}"

  tasks:
    - name: Create project directory
      file:
        path: "{{ project_dir }}"
        state: directory

    - name: Copy project files
      synchronize:
        src: ../.
        dest: "{{ project_dir }}"
        exclude:
          - .git
          - __pycache__
          - .pytest_cache
          - .env
          - node_modules
          - archive
          - ansible
        delete: yes

    - name: Create .env file
      copy:
        dest: "{{ project_dir }}/.env"
        content: |
          DB_URL=postgresql://hr:{{ db_password }}@db/hr
          DB_PASSWORD={{ db_password }}
          PUBLIC_URL=http://192.168.1.92:8000
          LOG_LEVEL=INFO
        mode: 0600

    - name: Ensure Docker is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Start services
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        state: present
        pull: always
      register: compose

    - name: Wait for web to be healthy
      uri:
        url: http://localhost:8000/health
        method: GET
        status_code: 200
      register: result
      until: result.status == 200
      retries: 10
      delay: 3

    - name: Run data migration
      docker_container:
        name: hr_migration
        image: hr-app:latest
        command: python -m src.migration
        env_file: "{{ project_dir }}/.env"
        networks:
          - name: hr_default
      ignore_errors: yes
