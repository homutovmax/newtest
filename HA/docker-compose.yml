services:
  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    ports:
      - "3000:5580"
    volumes:
      - ./data:/data
    environment:
      - TZ=Europe/Moscow
    networks:
      - matter-net

networks:
  matter-net:
    driver: bridge
